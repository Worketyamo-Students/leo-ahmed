<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scalebrnb=1.0">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" media="(width<=430px)" href="./assets/css/media.css">
    <title>LOGIN-LAYOUT</title>
</head>
<body>
    <div class="conteneur">
        <div class="conteneur_image">
            <img src="./assets/images/imagedefond.svg" alt="connecter-vous">
        </div>
        <div class="conteneur_form">
            <h1>Connexion a Blue Ocean</h1> 
            <div class="conteneur_form_bande">
                <form action="formulaire">
                    <!-- ceci est notre conteneur qui portera l'input email et le text email -->
                    <label class="conteneur_form_email">
                        Email <br>
                        <div class="conteneur_form_text">
                            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#979797"><path d="M160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h640q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H160Zm320-280L160-640v400h640v-400L480-440Zm0-80 320-200H160l320 200ZM160-640v-80 480-400Z"/></svg>
                            <input type="email" placeholder="abc@example.com">
                        </div>
                    </label>
                    <!-- ceci est notre conteneur qui portera l'input mot de passe et le text mot de passe -->
                    <label class="conteneur_form_password">
                        Mot de passe <br>
                        <div class="conteneur_form_text">
                            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#979797"><path d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm0-80h480v-400H240v400Zm240-120q33 0 56.5-23.5T560-360q0-33-23.5-56.5T480-440q-33 0-56.5 23.5T400-360q0 33 23.5 56.5T480-280ZM360-640h240v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85v80ZM240-160v-400 400Z"/></svg>
                            <input type="password" placeholder="******">
                        </div>
                    </label>
                    <!-- ceci est le lien juste avant le boutton -->
                    <a href="#">Mot de passe oublié? </a>
                </form>
                <!-- cici est le boutton connexion -->
                <div class="connexion">
                    <input class="conteneur_form_connexion" type="button" value="Connexion">
                </div>    
                <!-- ici c'est la partie pour le text"ou avec" encadrer de par et d'autre par deux barres-->
                <div class="conteneur_form_line">
                    <div></div>
                    <span>ou avec</span>
                    <div></div>
                </div>
                <!-- ici c'est la partie qui contient les icones en pied de page -->
                <div class="conteneur_form_icones">
                    <div class="logo"><img src="./assets/images/google.svg" alt="icone google"></div>
                    <div class="logo"><img src="./assets/images/facebook.svg" alt="icone facebook"></div>
                    <div class="logo"><img src="./assets/images/github.svg" alt="icone github"></div>
                </div>
            </div>    
            

        </div>
    </div>
</body>
</html>
